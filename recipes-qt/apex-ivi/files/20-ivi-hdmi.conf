context.objects = [
  {
    factory = adapter
    args = {
      factory.name = api.alsa.pcm.sink
      node.name = "ivi_hdmi_sink"
      node.description = "IVI HDMI Speakers"
      media.class = "Audio/Sink"
      api.alsa.path = "sysdefault:0"
      # Stable HDMI timing for both A2DP music and HFP calls.
      # 8 periods × 1024 frames ≈ 170 ms of buffer
      api.alsa.period-size = 1024
      api.alsa.period-num = 12
      api.alsa.headroom = 1024
      audio.format = "S16LE"
      audio.rate = 48000
      audio.channels = 2
      audio.position = "FL,FR"
      node.pause-on-idle = false
      priority.driver = 30000
      priority.session = 30000
    }
  }
]
