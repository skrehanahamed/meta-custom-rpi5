# WirePlumber owns Bluetooth device enumeration. Configure its BlueZ monitor
# to use oFono for the HFP/HSP control and SCO audio connection.
monitor.bluez.properties = {
  # The IVI is the receiver: phones send music to it (A2DP sink) and use it as
  # the hands-free unit for calls (HFP HF).
  bluez5.roles = [ a2dp_sink hfp_hf ]
  bluez5.hfphsp-backend = "ofono"
  # Pi 5 firmware rejects deferred wideband SCO sockets. CVSD provides clean audio.
  bluez5.enable-msbc = false
  # AAC prioritized for low-latency, high-fidelity music playback
  bluez5.codecs = [ aac sbc_xq sbc ]
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink hfp_hf ]
      }
    }
  }
  {
    matches = [
      {
        node.name = "~bluez_input.*"
      }
    ]
    actions = {
      update-props = {
        node.latency = "4096/48000"
      }
    }
  }
]

# A headless IVI does not have a desktop/logind seat.  Do not make Bluetooth
# discovery conditional on a seat becoming active.
wireplumber.components.rules = [
  {
    matches = [
      { name = "monitors/bluez.lua" }
    ]
    actions = {
      override = { wants = [] }
    }
  }
]
