name: Build & Release Raspberry Pi 5 Qt 6 Platform Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
        default: 'manual-build'

jobs:
  build-and-release:
    name: Build Yocto OS Image & Release
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space on Runner
        run: |
          echo "Freeing disk space on build runner..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect \
            xz-utils debianutils iputils-ping python3-git python3-jinja2 \
            libegl1-mesa libsdl1.2-dev pylint xterm zstd liblz4-tool bmap-tools

      - name: Cache Yocto SSTATE & Downloads
        uses: actions/cache@v4
        with:
          path: |
            downloads
            sstate-cache
          key: yocto-rpi5-${{ hashFiles('conf/local.conf.sample', 'recipes-*/**/*.bb', 'recipes-*/**/*.bbappend') }}
          restore-keys: |
            yocto-rpi5-

      - name: Setup Workspace & Layers
        run: |
          chmod +x setup-workspace.sh
          ./setup-workspace.sh

      - name: Configure Build with Native EGLFS Hardware GPU
        run: |
          # Ensure gbm and kms are included for 60 FPS hardware acceleration
          sed -i 's/PACKAGECONFIG:append:pn-qtbase = " xcb eglfs/PACKAGECONFIG:append:pn-qtbase = " xcb eglfs gbm kms/g' build/conf/local.conf

      - name: Execute BitBake Build
        run: |
          source sources/poky/oe-init-build-env build
          bitbake rpi5-qt-headless-image

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p deploy-artifacts
          
          # Find generated wic.bz2 image
          IMAGE_PATH=$(find build/tmp/deploy/images/raspberrypi5 -name "*rpi5-qt-headless-image*.rootfs.wic.bz2" | head -n 1)
          BMAP_PATH=$(find build/tmp/deploy/images/raspberrypi5 -name "*rpi5-qt-headless-image*.rootfs.wic.bmap" | head -n 1)
          
          if [ -n "$IMAGE_PATH" ]; then
            cp "$IMAGE_PATH" deploy-artifacts/rpi5-qt-platform-image.rootfs.wic.bz2
          fi
          
          if [ -n "$BMAP_PATH" ]; then
            cp "$BMAP_PATH" deploy-artifacts/rpi5-qt-platform-image.rootfs.wic.bmap
          fi
          
          # Copy pre-compiled GPU driver plugins and libraries
          mkdir -p deploy-artifacts/bin
          find build/tmp/work -name "libqeglfs-kms-integration.so" -exec cp {} deploy-artifacts/bin/ \; 2>/dev/null || true
          find build/tmp/work -name "libQt6EglFsKms*.so*" -exec cp -d {} deploy-artifacts/bin/ \; 2>/dev/null || true
          
          # Generate SHA256 Checksums
          cd deploy-artifacts
          sha256sum * 2>/dev/null > SHA256SUMS.txt || true
          cd ..
          
          echo "Artifacts prepared in deploy-artifacts/:"
          ls -lh deploy-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Raspberry Pi 5 Qt 6 Platform Layer - ${{ github.ref_name }}"
          body: |
            ## Raspberry Pi 5 Qt 6 Platform OS Image
            
            Production-ready Yocto build for **Raspberry Pi 5** featuring **Qt 6.7 LTS**, **Hardware DRM/KMS EGLFS (60 FPS)**, **Bluetooth 5.0**, **PipeWire Audio**, and **Automatic Headless Networking**.

            ### What's Included:
            * **OS Image**: `rpi5-qt-platform-image.rootfs.wic.bz2` (Flash directly with Raspberry Pi Imager or BalenaEtcher)
            * **Block Map**: `rpi5-qt-platform-image.rootfs.wic.bmap` (For fast flashing with bmaptool)
            * **Hardware GPU Plugins**: Pre-compiled `libqeglfs-kms-integration.so` and KMS support libraries
            * **Checksums**: `SHA256SUMS.txt`

            ### Flashing Instructions:
            1. Download `rpi5-qt-platform-image.rootfs.wic.bz2`.
            2. Open **Raspberry Pi Imager** or **BalenaEtcher**.
            3. Choose **Use Custom** and select the `.wic.bz2` file.
            4. Select your MicroSD card and click **Write**.
            5. Insert into Raspberry Pi 5 and power on with HDMI connected.
          files: |
            deploy-artifacts/rpi5-qt-platform-image.rootfs.wic.bz2
            deploy-artifacts/rpi5-qt-platform-image.rootfs.wic.bmap
            deploy-artifacts/SHA256SUMS.txt
            deploy-artifacts/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
